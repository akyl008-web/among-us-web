# Full stack: PostgreSQL + game server (serves the built client).
#   1. Create .env next to this file with AUTH_SECRET=<64 hex chars> and POSTGRES_PASSWORD=<password>
#   2. docker compose up --build
#   3. Open http://localhost:3001
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stellar_suspects
      POSTGRES_USER: stellar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stellar -d stellar_suspects']
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stellar:${POSTGRES_PASSWORD}@db:5432/stellar_suspects
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      CLIENT_ORIGIN: http://localhost:3001
    ports:
      - '3001:3001'

volumes:
  db-data:
